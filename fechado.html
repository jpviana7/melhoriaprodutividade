<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Acesso fechado</title>
<style>
  :root { --bg: #F2F2F7; --card: #FFFFFF; --txt: #0F172A; --txt2: #64748B; }
  @media (prefers-color-scheme: dark) { :root { --bg: #000; --card: #1C1C1E; --txt: #F8FAFC; --txt2: #94A3B8; } }
  * { box-sizing: border-box; margin: 0; }
  body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; background: var(--bg); color: var(--txt);
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }
  .card { max-width: 420px; width: 100%; background: var(--card); border-radius: 20px; padding: 32px 28px; text-align: center; box-shadow: 0 4px 16px -6px rgba(0,0,0,.08); }
  .ic { width: 56px; height: 56px; margin: 0 auto 18px; border-radius: 16px; background: rgba(255,187,0,.18); display: flex; align-items: center; justify-content: center; }
  h1 { font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
  p { margin-top: 8px; font-size: 14px; line-height: 1.5; color: var(--txt2); }
</style>
</head>
<body>
  <div class="card">
    <div class="ic"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#1B2F88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>
    <h1>Acesso fechado</h1>
    <p>Este painel está temporariamente indisponível.</p>
  </div>
</body>
</html>
