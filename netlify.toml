[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# O service worker não pode ficar em cache antigo
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# App FECHADO: qualquer endereço mostra só a tela de acesso fechado.
# Para reabrir, apague este bloco (as funções agendadas continuam rodando).
[[redirects]]
  from = "/*"
  to = "/fechado.html"
  status = 200
  force = true

# App dos líderes: mesmo arquivo, aberto em /lideres
[[redirects]]
  from = "/lideres"
  to = "/index.html"
  status = 200
