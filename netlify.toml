[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# O service worker não pode ficar em cache antigo
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# App dos líderes: mesmo arquivo, aberto em /lideres
[[redirects]]
  from = "/lideres"
  to = "/index.html"
  status = 200
